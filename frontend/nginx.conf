# LUNA-IRiS frontend server.
#
# Everything the browser needs is same-origin: /api and /outputs are proxied
# to the api service, so no CORS preflight or allowlist entry is involved for
# requests made from this origin (the API still allowlists localhost:5173 for
# the non-Docker dev flow).

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # The UI advertises image uploads up to 25 MB; nginx's default
    # client_max_body_size is 1 MB and would 413 them.
    client_max_body_size 25m;

    # Docker's embedded DNS, re-resolved every 10 s: a recreated api
    # container (new IP) can never strand nginx on a dead upstream, and the
    # api container does not have to exist before nginx boots.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # proxy_pass with a variable defers host resolution to request time and,
    # having no path part, forwards the original URI untouched (no rewriting).
    set $api_backend http://api:8000;

    # FastAPI backend (/api/health, /api/register, ...).
    location /api/ {
        proxy_pass $api_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A CPU-only registration run can take minutes; do not cut it off.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Registration products written to the api volume (matches image,
    # summary.json, warped output) are served by the API's own /outputs
    # StaticFiles mount — proxied so every link stays same-origin.
    location /outputs/ {
        proxy_pass $api_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Static UI (index.html, css/, js/, config.js).
    location / {
        try_files $uri $uri/ =404;
    }
}
